[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astrocalc"
version = "1.0.0"
description = "Keyboard-first astronomy calculation and export terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ephem==4.2", "textual>=8,<9", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
cycles = ["numpy>=2.3", "matplotlib>=3.10", "PyQt5>=5.15"]
clock = ["numpy>=2,<3", "pandas>=2.2,<3", "streamlit>=1.50,<2", "plotly>=6,<7"]
images = ["kaleido>=1.0,<2"]

[project.scripts]
astrocalc = "astrocalc.__main__:main"
universal-clock = "astrocalc.universal.cli:main"

[tool.setuptools.package-data]
"astrocalc.universal" = ["*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["astrocalc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
